# Cowtrol Systems configuration (body-temperature model version)
 
serial:
  port: /dev/ttyACM1        # Arduino Uno R4 WiFi over USB (check with: ls /dev/ttyACM* /dev/ttyUSB*)
  baud: 9600
 
# ---------------- Model: predicted cow body temperature (CBT) rise ----------------
# Trained on MmCows (real cows) with train_realcow.py. Inputs: THI (corrected for air speed and solar),
# clustering, the share of cows lying and the time of day. Output: the herd's average body temperature above
# each cow's normal, deg C (the fans serve a whole zone, so the model predicts the zone's average cow).
realcow:
  model_path: models/realcow_model.joblib
  standing_flag:                       # heat-stress sign: fewer cows lying than MmCows cows did at this THI
    min_thi: 72                        #   only checked at or above this ambient THI
    margin: 0.2                        #   flag when the lying share is this far below typical (0.2 = 20 points)
 
# ---------------- THI corrections (see heatload.py) ----------------
# MmCows has no air speed or solar data, so these enter as corrections to THI before the model.
heat_load:
  air_speed:                # ETIC air speed term for dairy cattle (Wang et al. 2018): coef * v^exponent * (body_temp - T)
    coef: 0.1173
    exponent: 0.707
    body_temp_c: 39.2
  solar:                    # radiation term of Mader et al. (2006) adjusted THI: + 0.0068 THI per W/m2
    thi_per_wm2: 0.0068     # (from feedlot cattle; the only published per-W/m2 THI term we found)
  clustering:               # physics estimate of neighbours' body heat. OFF: the model learned clustering from
    enabled: false          # MmCows directly. Set true to add it on top (it shrinks as air speed rises).
    sensible_heat_w: 500
    shared_air_area_m2: 3.0
    min_air_speed_m_s: 0.2
 
clustering:
  neighbor_radius_m: 2.5    # clustering = average number of other cows within this distance (about one cow length)
 
# ---------------- Inputs we do not sense yet ----------------
# Used until the camera or a sensor supplies them. All can be changed live on the dashboard ("Manual inputs").
manual_inputs:
  solar_wm2: 0              # solar radiation reaching the cows, W/m2 (0 = shaded / night, ~800 = full sun)
  clustering: 0             # average number of other cows within 2.5 m
  lying: 0.5                # share of cows lying, 0-1 (camera: yes/no per cow)
  occupied_quadrants: [Q1, Q2, Q3, Q4, Q5, Q6]   # quadrants with cows in them (camera: where each cow's box is)
  clock_hour: null          # null = the Pi's clock; 0-23.99 = pretend it is this time of day (demo/testing)
 
# ---------------- Quadrants, zones, fans and sensors ----------------
# The barn floor is 6 quadrants, 3 long x 2 wide, seen from behind the fans looking down the barn:
#      [Q3][Q6]   far
#      [Q2][Q5]   middle
#      [Q1][Q4]   near the fans
#      left right
# 4 fans stacked 2x2 on the end wall. Each zone is one side: its 2 fans (top and bottom) always run at the same
# speed and blow down its 3 quadrants. Arduino pins: fan 1 = 9, fan 2 = 10, fan 3 = 11, fan 4 = 3.
# Air speed AND THI for a zone = the average over the quadrants that have cows in them
# (all 3 if the zone has no cows reported).
areas:
  - {name: left,  fans: [1, 2], quadrants: [Q1, Q2, Q3]}
  - {name: right, fans: [3, 4], quadrants: [Q4, Q5, Q6]}
 
# Temperature/humidity sensor in each quadrant (the number the Arduino reports). A quadrant whose sensor is not
# answering uses the average of the working sensors on its side (or of all working sensors if none on its side).
# One sensor per quadrant (6 SHT45s behind the TCA9548A mux; sensor id = mux channel + 1). A failed/silent
# sensor borrows its side's average, so flaky wiring degrades gracefully.
quadrant_sensors: {Q1: 3, Q2: 2, Q3: 1, Q4: 6, Q5: 5, Q6: 4}
# For bench testing with ONE sensor for the whole barn, swap in:
# quadrant_sensors: {Q1: 1, Q2: 1, Q3: 1, Q4: 1, Q5: 1, Q6: 1}
 
# Calibration offsets ADDED to each sensor's reading (key = sensor id the Arduino reports; id 1..6 = mux ch 0,1,2,5,6,7).
# From the Nov 16-17 2026 barn co-location test vs a HOBO U23-001 (offset = minus the mean sensor-HOBO bias).
# Only verified at 21-22 C / 24-29 %RH. Delete this block or set values to 0 to disable.
sensor_offsets:
  1: {temp_c: 0.18,  rh_pct: -0.19}   # mux ch 0
  2: {temp_c: 0.21,  rh_pct: -1.61}   # mux ch 1
  3: {temp_c: 0.11,  rh_pct: -2.30}   # mux ch 2
  4: {temp_c: -0.07, rh_pct: -2.95}   # mux ch 5
  5: {temp_c: -0.11, rh_pct: -1.41}   # mux ch 6
  6: {temp_c: -0.08, rh_pct: -2.35}   # mux ch 7
 
# A side with no cows (camera / manual inputs) turns its fans off. Input faults still force 100 %.
empty_zone:
  thi_rules: none               # none = off at any THI | emergency = still 100 % at emergency_thi | all = keep every THI rule
 
fans:
  min_duty_pct: 35              # real fan cut-in from the airflow measurements (must match MIN_DUTY in the Arduino sketch)
 
airspeed_map:
  file: airspeed_map.csv        # your measurements: quadrant, fan_pct, point, air_speed_m_s (copy from data_templates/)
  placeholder_max_air_speed_m_s: 2.0   # straight line 0 -> this at 100 %, used for quadrants not measured yet
 
# ---------------- Operator goal ----------------
# The fan runs at the LOWEST speed that keeps the predicted body temperature rise under target_rise_c,
# and never below min_duty_pct. The LLM turns free text ("milk prices are high") into these two numbers,
# within the limits below; they can also be typed in on the dashboard. Safety rules still win.
goal:
  default:
    # target_rise_c is anchored to published core-body-temperature values:
    #   baseline_c (38.6) = thermoneutral core temp of a dairy cow (Idris et al. 2021, Animals 11:71,
    #                       "38.6 C, range 38.0-39.3"; Galan et al. 2018 PLoS ONE ~38.5).
    #   stress_threshold_c (38.8) = heat-stress core temp used on this same MmCows dataset (Alvi et al. 2026,
    #                       Comput. Electron. Agric. 112487, P(stress) threshold 38.8 C).
    #   onset rise = stress_threshold_c - baseline_c = 38.8 - 38.6 = 0.2 C (where heat stress begins).
    # We target BELOW that, to keep a safety buffer against model error (+-0.05-0.1 within our R2) and because
    # heat stress >> fan energy: target_rise_c 0.15 holds the herd at ~38.75 C, under the 38.8 onset.
    # NOTE: unlike the THI-68 onset, there is no single canonical core-temp heat-stress cutoff in the
    # literature (reviews give fever 39.4-39.7 C and call for more research); 38.8 is the value published on
    # this MmCows dataset. "Rise" = deg C above each cow's own cool baseline (median CBT when THI < 68).
    target_rise_c: 0.05
    min_duty_pct: 0
  limits:
    target_rise_c: [0.05, 0.4]  # 0.05 = cool hard (welfare / milk first), 0.4 = save energy
    min_duty_pct: [0, 100]
  # Reference values for the dashboard's absolute-CBT readout (estimated CBT = baseline_c + predicted rise):
  baseline_c: 38.6              # thermoneutral core temp (Idris et al. 2021; Galan et al. 2018)
  stress_threshold_c: 38.8      # heat-stress core temp on MmCows (Alvi et al. 2026)
 
# ---------------- Hard safety rules (applied AFTER the model; they always win) ----------------
safety:
  emergency_thi: 100           # ambient THI >= this -> fans 100% (UMN Extension "moderate-severe")
  stress_onset_thi: 100        # ambient THI >= this -> air-speed floor applies (Penn State, UMN)
  min_air_speed_m_s: 1.56     # 3.5 mph, low end of Penn State's preferred 3.5-5 mph (floor at ramp_full_thi)
  # Lever A: ramp the floor up across the onset band instead of a hard step at stress_onset_thi.
  # Required floor rises linearly from floor_start_m_s @ stress_onset_thi to min_air_speed_m_s @ ramp_full_thi.
  # Set ramp_full_thi == stress_onset_thi (or floor_start_m_s == min_air_speed_m_s) to restore the old hard step.
  floor_start_m_s: 0.7        # floor demanded right at stress_onset_thi (~35% fans in the measured map)
  ramp_full_thi: 100           # THI at which the full min_air_speed_m_s floor is required
  stale_data_s: 120           # no valid readings this long -> fans 100%
  valid_temp_c: [-40, 80]     # DHT20 rated range; a reading outside is a sensor fault (fans 100%)
  valid_rh_pct: [0, 100]
 
# ---------------- FMEA safeguards (safety.py) ----------------
safety_checks:
  override:                     # Alt 1: manual fan control from the dashboard
    max_minutes: 60             # override ends by itself after this long
    revoke_thi: 72              # ...or at once when any area's ambient THI reaches this (mild heat stress onset)
  sensors:                      # Alt 2: checked every control loop; any fault -> fans 100% + dashboard alert
    no_reading_s: 120           # no reading for this long
    flatline_minutes: 10        # temperature AND humidity both unchanged for this long...
    flatline_temp_c: 0.05       #   ...i.e. moved less than this
    flatline_rh_pct: 0.2
    max_dev_from_median_c: 10.0  # more than this from the median of the other sensors (needs 3+ sensors)
  camera:
    enabled: false              # true once the camera is connected
    source: picamera2           # picamera2 (Pi camera module) or usb
    usb_index: 0
    min_brightness: 15          # mean brightness 0-255 below this = blocked
    min_similarity: 0.6         # similarity to the reference view below this = moved
    reference_file: camera_reference.npy
 
# ---------------- Camera -> model inputs (vision_inputs.py) ----------------
# Turns YOLO detections (standing/lying cows) into per-zone occupied quadrants, clustering
# and lying share, replacing the dashboard "Manual inputs" while it is on.
# OFF until the camera is MOUNTED and calibrated: floor_quad_px and barn_wh_m both depend on
# the final camera position. Run calibrate_vision.py after mounting to set them.
vision:
  enabled: true                # true once mounted + calibrated
  model_path: best.pt           # fine-tuned weights on the Pi
  conf: 0.5                     # detection threshold (match what looked right in demo.py)
  imgsz: 320
  frame_w: 640
  frame_h: 480
  ground_point: center          # center (overhead view) or bottom (oblique/corner view)
  cluster_radius_m: 2.5         # "within 2.5 m" = one cow length (same as the model's training)
  lying_class_contains: lying   # class names whose text contains this count as lying
  # The barn floor's 4 corners IN THE IMAGE (pixels), order [near-left, near-right, far-right, far-left];
  # NEAR = row closest to the fans (Q1/Q4), LEFT = the Q1-Q3 side. PLACEHOLDER = whole 640x480 frame,
  # axis-aligned — REPLACE after mounting using calibrate_vision.py.
  floor_quad_px: [[0, 480], [640, 220], [339, 0], [10, 57]]
  barn_wh_m: [0.4572, 0.762]         # real floor size [width (left-right), length (near-far)] in metres — MEASURE and set
  quadrant_grid:                # which quadrant each (column, row) cell is; matches `areas`
    left:  {near: Q1, mid: Q2, far: Q3}
    right: {near: Q4, mid: Q5, far: Q6}
 
loop:
  decision_interval_s: 30   # sensor readings are averaged over this window
  log_csv: logs/decisions.csv
  log_jsonl: logs/decisions.jsonl   # full records
 
dashboard:
  port: 8000                # open http://<pi-hostname>.local:8000 from your laptop/phone
 
# LM Studio on your laptop: Developer tab -> Start Server, enable "Serve on Local Network".
# Host = laptop's IP on the hotspot (changes per connection; also editable from the dashboard).
llm:
  host: http://localhost:11434   # local Ollama on the Pi (OpenAI-compatible API at /v1)
  model: qwen2.5:0.5b            # fastest tiny model for the Pi 4 CPU; `ollama pull qwen2.5:0.5b`
  timeout_s: 300                 # Pi CPU is slow, esp. the first (cold) call; give it room
  history: 10               # recent decisions the LLM sees
 
guidelines:
  dir: guidelines           # .md / .txt / .pdf files used for retrieval (RAG)
  top_k: 3
 
